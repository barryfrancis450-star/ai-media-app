kind = "web"
previewPath = "/"
title = "AI Media Generator"
version = "1.0.0"
id = "artifacts/ai-media-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26086

[services.development]
run = "pnpm --filter @workspace/ai-media-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-media-generator", "run", "build" ]
publicDir = "artifacts/ai-media-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26086"
BASE_PATH = "/"
